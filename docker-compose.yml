services:
  postgres:
    image: postgres:15-alpine
    container_name: sentinelai-postgres
    environment:
      POSTGRES_DB: sentinelai
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sentinelpass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-net

  redis:
    image: redis:7-alpine
    container_name: sentinelai-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelai-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://sentinel:${DB_PASSWORD:-sentinelpass}@postgres:5432/sentinelai?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-jwtsecret12345}
      - ML_SERVICE_URL=http://ml-service:8000
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelai-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sentinel-net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: sentinelai-ml
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - FLASK_ENV=production
    networks:
      - sentinel-net

volumes:
  pgdata:
  redisdata:

networks:
  sentinel-net:
    driver: bridge
