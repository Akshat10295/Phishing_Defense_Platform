name: SentinelAI Core CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # 1. Node.js API Gateway Audits
    - name: Set up Node.js Runtime
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'

    - name: Install & Audit Node Dependencies
      run: |
        cd backend
        npm ci
        npx prisma generate

    # 2. Python ML Microservice Audits
    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: './ml-service/requirements.txt'

    - name: Install Python Requirements
      run: |
        cd ml-service
        python -m pip install --upgrade pip
        pip install -r requirements.txt

  docker_build_verification:
    runs-on: ubuntu-latest
    needs: audit_and_test

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build checks to guarantee production compilations never break
    - name: Verify Backend Container Build
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: false

    - name: Verify Frontend Container Build
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: false

    - name: Verify ML-Service Container Build
      uses: docker/build-push-action@v5
      with:
        context: ./ml-service
        file: ./ml-service/Dockerfile
        push: false
